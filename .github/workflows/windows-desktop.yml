# =====================================================================
# Build the Windows desktop program and installer
#   * on every push to main touching the app: build + self-test (artifact)
#   * on a version tag (v1.2.3): build + self-test + GitHub release
# =====================================================================
name: windows-desktop

on:
  push:
    branches: [main]
    paths: ["faceclock/**", "packaging/**", "requirements.txt", ".github/workflows/windows-desktop.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: pytest -q

      - name: Download face models
        run: python scripts/download_models.py

      - name: Build program (PyInstaller)
        run: pyinstaller packaging/faceclock.spec --noconfirm

      - name: Self-test of the packaged program
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FaceClock\FaceClock.exe" -ArgumentList "--selftest", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed ($($p.ExitCode))"; exit 1 }

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = (python -c "import faceclock; print(faceclock.__version__)") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\FaceClock -DestinationPath "dist\FaceClock-Portable-${{ steps.version.outputs.value }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FaceClock-Windows-${{ steps.version.outputs.value }}
          path: |
            dist/FaceClock-Setup-*.exe
            dist/FaceClock-Portable-*.zip
          retention-days: 30

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FaceClock ${{ steps.version.outputs.value }} for Windows
          files: |
            dist/FaceClock-Setup-*.exe
            dist/FaceClock-Portable-*.zip
          body: |
            **FaceClock for Windows** — download `FaceClock-Setup-${{ steps.version.outputs.value }}.exe`, run it, then start FaceClock from the desktop icon.

            * No Python, no command line: the face models are included.
            * First start: a short wizard creates your building and administrator account.
            * Your data stays on your computer in `%APPDATA%\FaceClock`.

            The installer is not code-signed: if Windows SmartScreen shows a warning, click **More info → Run anyway**.
